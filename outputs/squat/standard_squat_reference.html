      tickDecimals: 2,

    drawChart("repeated", repeated, "time_seconds", "standard_angle", {
      xLabel: "Time (s)",
      xTicks: Array.from({ length: 4 }, (_, i) => oneDuration * i),
      tickDecimals: 1,
      repetitionDuration: oneDuration,
    });
  </script>
</body>
